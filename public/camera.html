<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<title>Embers Camera</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
<style>
  :root { --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace; }
  html, body { height: 100%; }
  body { padding: max(10px, env(safe-area-inset-top)) 0 max(14px, env(safe-area-inset-bottom)); justify-content: space-between; overflow: hidden; background-image: radial-gradient(520px 300px at 50% -6%, rgba(255,20,147,0.13), rgba(255,20,147,0) 70%); }

  .top { width: 100%; max-width: 520px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 18px; gap: 12px; }
  .party { font-family: var(--serif); font-weight: 600; font-size: 18px; color: #ececec; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.15; }
  .who { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .closes { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; padding-bottom: 2px; }

  .viewfinder {
    position: relative; overflow: hidden; background: #000; border-radius: 6px;
    aspect-ratio: 3 / 4; width: min(100vw - 20px, calc((100dvh - 262px) * 0.75));
    box-shadow: 0 0 0 1px #262626, 0 18px 40px rgba(0,0,0,0.6);
  }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  video.mirror { transform: scaleX(-1); }

  /* Film look for the live preview: tint, vignette, moving grain */
  .tint { position: absolute; inset: 0; background: var(--tint, rgba(255, 150, 50, 0.10)); mix-blend-mode: soft-light; pointer-events: none; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,var(--vig, 0.5)) 100%); pointer-events: none; }
  .grain {
    position: absolute; inset: -20%; pointer-events: none; opacity: var(--grain, 0.35); mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: jitter 0.4s steps(4) infinite;
  }
  @keyframes jitter { 0% { transform: translate(0,0); } 25% { transform: translate(-3%,2%); } 50% { transform: translate(2%,-3%); } 75% { transform: translate(-2%,-1%); } 100% { transform: translate(1%,3%); } }
  /* Viewfinder corner marks */
  .marks { position: absolute; inset: 14px; pointer-events: none; opacity: 0.7;
    --m: rgba(255,255,255,0.75);
    background:
      linear-gradient(var(--m),var(--m)) 0 0 / 18px 1.5px no-repeat, linear-gradient(var(--m),var(--m)) 0 0 / 1.5px 18px no-repeat,
      linear-gradient(var(--m),var(--m)) 100% 0 / 18px 1.5px no-repeat, linear-gradient(var(--m),var(--m)) 100% 0 / 1.5px 18px no-repeat,
      linear-gradient(var(--m),var(--m)) 0 100% / 18px 1.5px no-repeat, linear-gradient(var(--m),var(--m)) 0 100% / 1.5px 18px no-repeat,
      linear-gradient(var(--m),var(--m)) 100% 100% / 18px 1.5px no-repeat, linear-gradient(var(--m),var(--m)) 100% 100% / 1.5px 18px no-repeat; }
  .stamp { position: absolute; right: 26px; bottom: 24px; font-family: var(--mono); font-weight: 500; color: #ff9a3c; font-size: 14px; text-shadow: 0 0 6px rgba(255,120,0,0.7); pointer-events: none; }
  .shutterflash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .shutterflash.go { animation: flash 0.25s ease-out; }
  @keyframes flash { 0% { opacity: 0.85; } 100% { opacity: 0; } }

  /* The roll: one frame per shot. Lit frames are unexposed, dark ones are used. */
  .roll { width: min(100vw - 20px, 520px); display: flex; align-items: center; gap: 12px; }
  .strip { flex: 1; display: flex; gap: 4px; padding: 9px 6px; border-radius: 4px; background: #1a1a1a;
    background-image: radial-gradient(circle, #0a0a0a 1.6px, transparent 2px), radial-gradient(circle, #0a0a0a 1.6px, transparent 2px);
    background-size: 9px 6px, 9px 6px; background-position: 0 1px, 0 calc(100% - 1px); background-repeat: repeat-x, repeat-x; }
  .frame { flex: 1; height: 20px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 8px rgba(255,20,147,0.45); transition: background 0.25s, box-shadow 0.25s; }
  .frame.used { background: #2b2b2b; box-shadow: none; }
  .frame.pop { animation: pop 0.35s ease-out; }
  @keyframes pop { 0% { background: #fff; box-shadow: 0 0 14px #fff; } 100% { background: #2b2b2b; box-shadow: none; } }
  .count { font-family: var(--mono); font-size: 13px; color: var(--muted); min-width: 56px; text-align: right; white-space: nowrap; }
  .count b { font-size: 22px; font-weight: 500; color: var(--ink); }

  .looksbar { width: 100%; max-width: 520px; display: flex; gap: 16px; justify-content: center; align-items: center; padding: 0 12px; }
  .lk { width: auto; margin: 0; padding: 6px 2px 7px; font-size: 14px; font-weight: 500; background: transparent; color: #7c7c7c; border: 0; border-bottom: 2px solid transparent; border-radius: 0; box-shadow: none; }
  .lk:hover { background: transparent; color: var(--ink); }
  .lk.on { color: #f2f2f2; border-bottom-color: var(--accent); }
  .lk.date { margin-left: 8px; padding-left: 14px; border-left: 1px solid #2a2a2a; }
  .lk.date.on { border-bottom-color: transparent; color: var(--pink-soft); }

  .controls { width: 100%; max-width: 420px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; }
  .shutter { width: 80px; height: 80px; margin: 0; padding: 0; border-radius: 50%; background: transparent; border: 2px solid #d5d5d5; box-shadow: none; position: relative; }
  .shutter::after { content: ''; position: absolute; inset: 6px; border-radius: 50%; background: #e6e6e6; transition: transform 0.1s, background 0.1s; }
  .shutter:hover { background: transparent; }
  .shutter:active::after { transform: scale(0.88); background: var(--accent); }
  .shutter:disabled { opacity: 0.35; }
  .side { width: 52px; height: 52px; margin: 0; padding: 0; display: grid; place-items: center; border-radius: 50%; background: #151515; border: 1px solid #262626; color: var(--ink); box-shadow: none; }
  .side:hover { background: #1c1c1c; }
  .side svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .side.on { background: var(--accent); border-color: var(--accent); color: #0a0a0a; box-shadow: 0 0 16px rgba(255,20,147,0.5); }
  .side.on svg { fill: currentColor; }
  .fullflash { position: fixed; inset: 0; background: #fff; z-index: 6; opacity: 0; pointer-events: none; transition: opacity 0.12s; }
  .fullflash.on { opacity: 1; }

  .toast { position: fixed; left: 50%; top: 68px; transform: translateX(-50%); background: #000000e6; color: var(--ink); padding: 8px 14px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity 0.2s; pointer-events: none; max-width: 90%; text-align: center; z-index: 5; }
  .toast.show { opacity: 1; }
  .toast.err { background: #5a1020e6; }

  .overlay { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px; text-align: center; z-index: 10; }
  .overlay .btn, .overlay button { max-width: 320px; }
  @media (prefers-reduced-motion: reduce) { .grain { animation: none; } .frame.pop { animation: none; } }
</style>
</head>
<body>
<div id="inapp" class="banner hidden" style="margin:0 16px;"></div>

<div class="top">
  <div style="min-width:0">
    <div class="party" id="party">Embers</div>
    <div class="who" id="who"></div>
  </div>
  <div class="closes" id="closes"></div>
</div>

<div class="viewfinder" id="vf">
  <video id="video" playsinline muted autoplay></video>
  <div class="tint"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
  <div class="marks"></div>
  <div class="stamp" id="stamp"></div>
  <div class="shutterflash" id="shutterFlash"></div>
</div>

<div class="roll">
  <div class="strip" id="strip" aria-hidden="true"></div>
  <div class="count" aria-live="polite"><b id="left">--</b> left</div>
</div>

<div class="looksbar" id="looksbar"></div>

<div class="controls">
  <button id="flashBtn" class="side" aria-label="Flash" title="Flash"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></button>
  <button id="shutter" class="shutter" aria-label="Take photo" disabled></button>
  <button id="flip" class="side" aria-label="Flip camera" title="Flip camera"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg></button>
</div>

<div id="fullflash" class="fullflash"></div>
<div id="toast" class="toast"></div>

<div id="msgOverlay" class="overlay hidden">
  <h1 id="ovTitle"></h1>
  <p id="ovBody" class="muted"></p>
  <a id="ovLink" class="btn hidden" href="#">See the photos</a>
  <button id="ovRetry" class="ghost hidden">Try the camera again</button>
</div>

<canvas id="work" class="hidden"></canvas>

<script src="/common.js"></script>
<script src="/looks.js"></script>
<script>
(function () {
  showInAppBanner($('inapp'));

  const token = localStorage.getItem('filmcam_token');
  if (!token) { location.replace('/?p=' + (localStorage.getItem('filmcam_party') || '')); return; }

  const video = $('video'), shutter = $('shutter'), work = $('work');
  let stampPref = null, maxShots = 10, facing = 'environment', stream = null, left = 0, busy = false, look = 'classic', closed = false, flashOn = false, hostLook = 'classic';

  $('stamp').textContent = stampText(new Date());
  try { const sp = localStorage.getItem('filmcam_stamp'); stampPref = sp === '1' ? true : sp === '0' ? false : null; } catch (e) {}
  buildLooksBar();
  try { flashOn = localStorage.getItem('filmcam_flash') === '1'; } catch (e) {}
  $('flashBtn').classList.toggle('on', flashOn);

  // Live preview follows the film look the host picked.
  function buildLooksBar() {
    const SHORT = { classic: 'Classic', golden: 'Golden', cool35: 'Cool 35', mono: 'B&W' };
    const bar = $('looksbar');
    if (bar.childElementCount) return;
    Object.keys(LOOKS).forEach((k) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'lk'; b.dataset.k = k; b.textContent = SHORT[k] || LOOKS[k].name;
      b.addEventListener('click', () => { try { localStorage.setItem('filmcam_look', k); } catch (e) {} setLook(k); });
      bar.appendChild(b);
    });
    const d = document.createElement('button');
    d.type = 'button'; d.className = 'lk date'; d.id = 'dateBtn'; d.textContent = 'Date';
    d.addEventListener('click', () => {
      stampPref = !stampOn();
      try { localStorage.setItem('filmcam_stamp', stampPref ? '1' : '0'); } catch (e) {}
      applyStamp();
      toast(stampPref ? 'Date stamp on' : 'Date stamp off');
    });
    bar.appendChild(d);
  }
  // The stamp follows the look's default until the guest chooses.
  function stampOn() { return stampPref === null ? Boolean(LOOKS[look].stamp) : stampPref; }
  function applyStamp() {
    const on = stampOn();
    $('stamp').style.display = on ? '' : 'none';
    $('stamp').style.color = LOOKS[look].stamp || '#ff9a3c';
    const d = $('dateBtn'); if (d) { d.classList.toggle('on', on); d.setAttribute('aria-pressed', on ? 'true' : 'false'); }
  }
  function setLook(key) {
    look = LOOKS[key] ? key : 'classic';
    const L = LOOKS[look];
    const vf = $('vf');
    video.style.filter = L.css.filter;
    vf.style.setProperty('--tint', L.css.tint);
    vf.style.setProperty('--grain', L.css.grain);
    vf.style.setProperty('--vig', L.vig);
    applyStamp();
    document.querySelectorAll('.lk').forEach((b) => b.classList.toggle('on', b.dataset.k === look));
  }

  function toast(text, isErr) {
    const t = $('toast');
    t.textContent = text;
    t.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { t.className = 'toast'; }, isErr ? 3500 : 1400);
  }

  function overlay(title, body, opts) {
    const o = opts || {};
    $('ovTitle').textContent = title;
    $('ovBody').textContent = body;
    $('ovLink').classList.toggle('hidden', !o.link);
    if (o.link) $('ovLink').href = o.link;
    $('ovRetry').classList.toggle('hidden', !o.retry);
    $('msgOverlay').classList.remove('hidden');
  }

  function drawStrip(popLast) {
    const strip = $('strip');
    if (strip.childElementCount !== maxShots) {
      strip.innerHTML = '';
      for (let i = 0; i < maxShots; i++) { const f = document.createElement('div'); f.className = 'frame'; strip.appendChild(f); }
    }
    const used = maxShots - left;
    Array.from(strip.children).forEach((f, i) => {
      f.classList.toggle('used', i < used);
      f.classList.remove('pop');
      if (popLast && i === used - 1) { void f.offsetWidth; f.classList.add('pop'); }
    });
  }

  function setLeft(n, popLast) {
    left = n;
    $('left').textContent = String(n);
    drawStrip(popLast);
    shutter.disabled = n <= 0 || busy || !stream;
    if (n <= 0) {
      stopCamera();
      overlay('Roll finished', 'That is all of your shots. Your photos get developed after the party, and the host will email you a link.');
    }
  }

  function stopCamera() {
    if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
  }

  async function startCamera() {
    stopCamera();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      overlay('Camera not available', 'This browser cannot open the camera. Open the link in Safari or Chrome.', { retry: true });
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1440 } },
        audio: false,
      });
      video.srcObject = stream;
      video.classList.toggle('mirror', facing === 'user');
      await video.play().catch(() => {});
      $('msgOverlay').classList.add('hidden');
      shutter.disabled = left <= 0 || busy;
    } catch (err) {
      const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
      overlay(
        denied ? 'Camera is blocked' : 'Could not start the camera',
        denied
          ? 'Allow camera access for this site: tap the aA or lock icon in the address bar, open Website Settings, set Camera to Allow, then reload.'
          : 'Make sure no other app is using the camera, then try again.',
        { retry: true }
      );
    }
  }

  // ---- Flash ----
  // Android rear cameras can light the real torch. iPhones cannot, so the rear camera there gets a
  // simulated direct-flash look. The front camera uses a bright white screen.
  function torchSupported() {
    const t = stream && stream.getVideoTracks()[0];
    return Boolean(facing === 'environment' && t && t.getCapabilities && t.getCapabilities().torch);
  }
  async function torch(on) {
    try { await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ torch: on }] }); } catch (e) { /* ignore */ }
  }
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  async function flashBefore() {
    if (!flashOn) return { simulated: false };
    if (facing === 'user') { $('fullflash').classList.add('on'); await wait(350); return { simulated: false, screen: true }; }
    if (torchSupported()) { await torch(true); await wait(450); return { simulated: false, torch: true }; }
    return { simulated: true };
  }
  async function flashAfter(f) {
    if (f.screen) $('fullflash').classList.remove('on');
    if (f.torch) await torch(false);
  }

  // Direct-flash feel: bright centre, harsher contrast, dark falloff around the edges.
  function flashBoost(ctx, w, h) {
    const img = ctx.getImageData(0, 0, w, h), d = img.data;
    const cx = w / 2, cy = h * 0.55, maxd = Math.hypot(cx, cy);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        const f = 1.28 - 0.55 * Math.pow(Math.hypot(x - cx, y - cy) / maxd, 1.4);
        for (let c = 0; c < 3; c++) {
          let v = (d[i + c] * f - 128) * 1.14 + 128;
          d[i + c] = v < 0 ? 0 : v > 255 ? 255 : v;
        }
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  function capture(simulatedFlash) {
    const vw = video.videoWidth, vh = video.videoHeight;
    // crop the center to 3:4 so the photo matches what you see in the viewfinder
    const target = 3 / 4;
    let sw = vw, sh = vh;
    if (vw / vh > target) sw = vh * target; else sh = vw / target;
    const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
    const outW = Math.min(960, Math.round(sw));
    const outH = Math.round(outW / target);
    work.width = outW; work.height = outH;
    const ctx = work.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, outW, outH);
    if (simulatedFlash) flashBoost(ctx, outW, outH);
    applyLook(ctx, outW, outH, look, new Date(), stampOn());
    return work.toDataURL('image/jpeg', 0.82);
  }

  async function shoot() {
    if (busy || left <= 0 || !stream || !video.videoWidth) return;
    busy = true; shutter.disabled = true;
    $('shutterFlash').classList.remove('go'); void $('shutterFlash').offsetWidth; $('shutterFlash').classList.add('go');
    if (navigator.vibrate) navigator.vibrate(25);
    let f = { simulated: false };
    try {
      f = await flashBefore();
      const image = capture(f.simulated);
      await flashAfter(f);
      const r = await api('/api/shoot', { method: 'POST', token, body: { image } });
      busy = false;
      toast('Shot saved');
      setLeft(r.shotsLeft, true);
    } catch (err) {
      await flashAfter(f);
      busy = false;
      if (err.status === 401) { localStorage.removeItem('filmcam_token'); location.replace('/'); return; }
      toast(err.message, true);
      if (err.status === 403) { toast(err.message, true); await refresh(); } else shutter.disabled = left <= 0;
    }
  }

  async function refresh() {
    try {
      const me = await api('/api/me', { token });
      $('party').textContent = me.partyName; $('who').textContent = me.name;
      if (me.maxShots) maxShots = me.maxShots;
      hostLook = me.filmLook;
      let mine = ''; try { mine = localStorage.getItem('filmcam_look') || ''; } catch (e) {}
      setLook(LOOKS[mine] ? mine : hostLook);
      closed = me.closed;
      if (me.released) {
        stopCamera();
        overlay('Your film is developed', 'The host has released the photos.', { link: me.galleryUrl });
        return;
      }
      if (me.closed) {
        stopCamera();
        overlay('The roll has ended', 'The host closed the camera. The photos get developed soon, and you will get an email when the gallery is ready.');
        return;
      }
      if (me.endsAt) {
        const t = new Date(me.endsAt);
        $('closes').textContent = 'Closes ' + t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        const ms = t.getTime() - Date.now();
        clearTimeout(refresh._t);
        if (ms > 0 && ms < 2147483000) refresh._t = setTimeout(refresh, ms + 500);
      }
      setLeft(me.shotsLeft);
    } catch (err) {
      if (err.status === 401) { localStorage.removeItem('filmcam_token'); location.replace('/?p=' + (localStorage.getItem('filmcam_party') || '')); }
      else toast(err.message, true);
    }
  }

  shutter.addEventListener('click', shoot);
  $('flip').addEventListener('click', () => { facing = facing === 'environment' ? 'user' : 'environment'; startCamera(); });
  $('flashBtn').addEventListener('click', () => {
    flashOn = !flashOn;
    try { localStorage.setItem('filmcam_flash', flashOn ? '1' : '0'); } catch (e) {}
    $('flashBtn').classList.toggle('on', flashOn);
    $('flashBtn').setAttribute('aria-pressed', flashOn ? 'true' : 'false');
    if (flashOn) toast(facing === 'user' ? 'Flash on: screen lights up' : torchSupported() ? 'Flash on' : 'Flash on (simulated on this phone)');
    else toast('Flash off');
  });
  $('ovRetry').addEventListener('click', startCamera);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && left > 0 && !closed && (!stream || stream.getVideoTracks().every((t) => t.readyState === 'ended'))) startCamera();
  });

  refresh().then(() => { if (left > 0 && !closed) startCamera(); });
})();
</script>
</body>
</html>
